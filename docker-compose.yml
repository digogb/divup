version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: divup-api-dev
    ports:
      - "8001:8001"
    environment:
      - ENVIRONMENT=development
      - UPLOAD_DIR=/app/uploads
      - LOG_LEVEL=DEBUG
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
    volumes:
      - ./backend/app:/app/app:ro  # Hot reload do código
      - ./pwa:/app/pwa:ro          # Hot reload da PWA
      - ./uploads:/app/uploads      # Persistir uploads
      - ./backend/credentials.json:/app/credentials.json:ro # Credenciais Google
    restart: unless-stopped

  # Cloudflare Tunnel: expõe https://divup.rglabs.tech -> api:8001
  # O token fica só no .env do servidor (CLOUDFLARE_TUNNEL_TOKEN), fora do Git.
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: divup-tunnel
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - api
    restart: unless-stopped

